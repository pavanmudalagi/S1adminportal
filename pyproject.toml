[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "s1am"
dynamic = ["version"]
description = "SentinelOne Account Manager — CLI and Python client for the Management and Usage Metering APIs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sentinelone", "security", "cli", "api", "mssp", "edr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3<2",
    "flask>=3.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]

[project.scripts]
s1am = "s1am.cli:main"

[tool.setuptools.dynamic]
version = { attr = "s1am.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["s1am*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::urllib3.exceptions.NotOpenSSLWarning"]
